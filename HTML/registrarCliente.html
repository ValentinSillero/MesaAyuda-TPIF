<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Mesa de Ayuda</title>

    <style type="text/css">

        label {
            font-size: 18px;
        }

        form {
            width: 500px;
            border: 1px solid black;
        }

        input {
            margin: 7px;
            padding: 2px;
        }

        .form-label {
            margin-bottom: 0;
        }

        .txt {
            display: inline-block;
            width: 80%;
            outline: none;
            margin: 0;
        }

        #resultado {
            font-weight: bold;
        }

    </style>
</head>

<body>

    <center>
        <img
            src="HelpDeskGirl.png"
            alt="Nuestra imagen corporativa"
            style="width:200px;height:150px;"
        >
    </center>

    <center>
        <h1>Sistema de Mesa de Ayuda</h1>
        <h2>Registración de usuario</h2>
    </center>

    <center>

        <form class="form" style="background-color:#d8f7cf">

            <br>

            <table>

                <tr>
                    <td>
                        <label class="form-label">Nombre</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input
                            class="txt"
                            name="nombre"
                            type="text"
                            placeholder="Nombre"
                        >
                    </td>
                </tr>

                <tr>
                    <td>&nbsp;</td>
                </tr>

                <tr>
                    <td>
                        <label class="form-label">Correo electrónico</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input
                            class="txt"
                            name="contacto"
                            type="email"
                            placeholder="Correo electrónico"
                        >
                    </td>
                </tr>

                <tr>
                    <td>&nbsp;</td>
                </tr>

                <tr>
                    <td>
                        <label class="form-label">Contraseña</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input
                            class="txt"
                            name="password"
                            type="password"
                            placeholder="Contraseña"
                        >
                    </td>
                </tr>

                <tr>
                    <td>&nbsp;</td>
                </tr>

                <tr>
                    <td>
                        <label class="form-label">Repetir contraseña</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input
                            class="txt"
                            name="password2"
                            type="password"
                            placeholder="Repetir contraseña"
                        >
                    </td>
                </tr>

                <tr>
                    <td>&nbsp;</td>
                </tr>

                <tr>
                    <td style="text-align:center;">
                        <span id="resultado"></span>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input
                            name="termscondition"
                            type="checkbox"
                        >

                        Acepto los términos y condiciones
                    </td>
                </tr>

            </table>

            <br>

            <button type="submit">
                Registrarse
            </button>

            <p>
                <a href="loginClient.html">
                    Volver al inicio de sesión
                </a>
            </p>

        </form>

    </center>

    <script src="registrarCliente.js" type="module"></script>

</body>

</html>
